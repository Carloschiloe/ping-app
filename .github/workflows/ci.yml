name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/staging-beta

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Test imports require a Supabase URL and service key, but must never use live credentials.
      # The reserved .invalid domain prevents these placeholders from pointing to a real Supabase project.
      - name: Offline backend tests
        run: npm test
        env:
          SUPABASE_URL: https://supabase-ci.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-offline-placeholder-not-a-secret

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
