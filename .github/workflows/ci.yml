name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/staging-beta

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      # These four durable integration suites create users in a REAL local Supabase.
      # Never aim them at a live project or pretend that .invalid is a running database.
      # Run them separately when an isolated local Supabase with its schema is available.
      # All other backend suites remain enabled, including mocked integration tests.
      - name: Offline backend tests (four local-Supabase suites not covered)
        run: |
          # Fresh, test-only HMAC signing key. No production secrets or reusable key in the repository.
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          npm test -- \
            --exclude '**/agentExactCommitmentCount.integration.test.ts' \
            --exclude '**/agentReadV4DurableOrchestration.integration.test.ts' \
            --exclude '**/agentTurnAdmissionRoutingMode.integration.test.ts' \
            --exclude '**/agentTurnRoutingSelection.integration.test.ts'
        env:
          # Some test imports initialize a client; this placeholder must never reach a live service.
          SUPABASE_URL: https://supabase-ci.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-offline-placeholder-not-a-secret

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
