name: Ping Jarvis staging certification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact staging commit to certify'
        required: true
        type: string

permissions:
  contents: read

jobs:
  jarvis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ping-staging-certification
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run 100 conversation certification
        env:
          PING_STAGING_BASE_URL: https://ping-backend-staging.onrender.com/api
          PING_EXPECTED_SHA: ${{ inputs.source_sha }}
          SUPABASE_URL: ${{ secrets.PING_STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PING_STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PING_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/e2e-jarvis-staging.mjs
      - name: Upload Jarvis evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ping-jarvis-certification-${{ inputs.source_sha }}
          path: backend/.m8-smoke-artifacts/jarvis/*.json
          if-no-files-found: error
          retention-days: 30
