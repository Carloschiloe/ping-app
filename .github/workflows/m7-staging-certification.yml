name: M7 staging certification

on:
  push:
    branches:
      - codex/staging-beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-staging-certification
  cancel-in-progress: true

env:
  STAGING_BASE_URL: https://ping-backend-staging.onrender.com/api
  STAGING_BRANCH: codex/staging-beta

jobs:
  quality:
    name: Quality gate
    if: ${{ github.ref == 'refs/heads/codex/staging-beta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: M7 focused offline regression tests
        run: |
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          npm exec -- vitest run \
            tests/agentSemanticInterpreter.regression.test.ts \
            tests/agentObjectiveInterpreter.test.ts \
            tests/agentDialogueContinuation.test.ts
        env:
          SUPABASE_URL: https://supabase-ci.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-offline-placeholder-not-a-secret

  deploy-and-certify:
    name: Deploy and certify staging
    needs: quality
    if: ${{ needs.quality.result == 'success' && github.ref == 'refs/heads/codex/staging-beta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: m7-staging-certification
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify staging branch target
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "refs/heads/${STAGING_BRANCH}" | awk '{print $1}')"
          test -n "$remote_sha"
          test "$remote_sha" = "$GITHUB_SHA"
          echo "STAGING_SOURCE_SHA=$remote_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Request staging deploy
        shell: bash
        env:
          RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_STAGING_DEPLOY_HOOK_URL"
          curl --fail-with-body --silent --show-error --location \
            --request POST --retry 3 --max-time 60 \
            "$RENDER_STAGING_DEPLOY_HOOK_URL" >/dev/null
      - name: Wait for exact healthy deployment
        shell: bash
        run: |
          set -euo pipefail
          expected_short="${GITHUB_SHA:0:7}"
          health_url="${STAGING_BASE_URL}/health"
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --max-time 30 "$health_url" || true)"
            ok="$(printf '%s' "$body" | jq -r '.ok // false' 2>/dev/null || true)"
            db="$(printf '%s' "$body" | jq -r '.db_status // ""' 2>/dev/null || true)"
            marker="$(printf '%s' "$body" | jq -r '.deployment_marker // ""' 2>/dev/null || true)"
            deployed="$(printf '%s' "$body" | jq -r '.commit // ""' 2>/dev/null || true)"
            if [[ "$ok" == "true" && "$db" == "connected" && "$marker" == "ping-backend-staging" && ( "$deployed" == "$GITHUB_SHA" || "$deployed" == "$expected_short" ) ]]; then
              {
                echo "STAGING_HEALTH=PASS"
                echo "STAGING_DEPLOYED_SHA=$deployed"
                echo "STAGING_EXPECTED_SHA=$GITHUB_SHA"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "Staging did not converge to the exact workflow SHA or health contract." >&2
          exit 1
      - name: Run authenticated M7 E2E
        working-directory: backend
        env:
          M7_STAGING_BASE_URL: ${{ env.STAGING_BASE_URL }}
          M7_EXPECTED_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.M7_STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.M7_STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.M7_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/e2e-m7-agent-staging.mjs
      - name: Upload M7 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m7-staging-evidence-${{ github.sha }}
          path: backend/.m7-smoke-artifacts/staging-agent/*.json
          if-no-files-found: warn
          retention-days: 14
