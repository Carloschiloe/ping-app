# Render's free plan puts the server to sleep after 15 minutes without
# requests, and waking it takes up to a minute. During Chile's waking hours
# (07:00 to 24:00, UTC-3) this asks for /health every 5 minutes so Vorian
# answers at once. Nights are left out on purpose: the Render account's
# 750 free hours a month are shared with another service.
name: Keep server awake

on:
  schedule:
    - cron: '*/5 10-23,0-2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the server for its health
        run: curl --silent --show-error --max-time 90 --retry 2 --output /dev/null --write-out '%{http_code} in %{time_total}s\n' https://api.vorian.app/health
