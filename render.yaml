services:
  - type: web
    name: ping-backend
    runtime: node
    region: oregon
    plan: free
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PING_ENVIRONMENT
        value: production
      - key: PING_SEMANTIC_MODEL
        value: gpt-6-luna
      - key: PING_SEMANTIC_MODEL_FAMILY
        value: modern_reasoning
      - key: M8_LIVE_VOICE_ENABLED
        value: "true"
      - key: M8_LIVE_VOICE_MODEL
        value: gpt-realtime-2.1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RUN_CRON_JOBS
        value: "false"
      - key: ENABLE_AUTOMATIONS
        value: "false"
      - key: ENABLE_NON_MVP_CAPABILITIES
        value: "false"
      - key: ENABLE_OPERATION_MODULE
        value: "false"
      - key: ENABLE_CALENDAR_INTEGRATION
        value: "false"
      - key: ENABLE_CALLS
      - key: ENABLE_LEGACY_SATELLITE_WRITERS
        value: "false"
        value: "false"
      - key: ENABLE_PRIVATE_FILE_READS
        value: "true"
      - key: ENABLE_PRIVATE_FILE_UPLOADS
        value: "false"
      - key: ENABLE_PRIVATE_MESSAGE_UPLOADS
        value: "true"
