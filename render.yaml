services:
  - type: web
    name: ping-app
    runtime: node
    region: oregon
    plan: free
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PING_ENVIRONMENT
        value: production
      - key: PING_SEMANTIC_MODEL
        value: gpt-6-luna
      - key: PING_SEMANTIC_MODEL_FAMILY
        value: modern_reasoning
      - key: PING_ENABLE_SEMANTIC_READ_FAST_PATH
        value: "true"
      - key: PING_EXPECTED_SUPABASE_PROJECT_REF
        value: wbigqhtuzfmpnxservlf
      - key: PING_ENABLE_AGENT_CONVERSATION_EVENTS
        value: "true"
      - key: PING_ENABLE_DURABLE_AGENT_TURN
        value: "true"
      - key: PING_M7_DATABASE_URL
        sync: false
      - key: PING_M7_PRIVATE_DB_CHECK
        sync: false
      - key: M8_LIVE_VOICE_ENABLED
        value: "true"
      - key: M8_LIVE_VOICE_TELEMETRY_PERSISTENCE
        value: "true"
      - key: M8_LIVE_VOICE_MODEL
        value: gpt-realtime-2.1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RUN_CRON_JOBS
        value: "false"
      - key: ENABLE_AUTOMATIONS
        value: "false"
      # Safe durable-history repair only; does not enable reminders or pushes.
      - key: ENABLE_AGENT_HISTORY_RECONCILER
        value: "true"
      - key: ENABLE_NON_MVP_CAPABILITIES
        value: "false"
      - key: ENABLE_OPERATION_MODULE
        value: "false"
      - key: ENABLE_CALENDAR_INTEGRATION
        value: "false"
      - key: ENABLE_CALLS
        value: "false"
      - key: ENABLE_LEGACY_SATELLITE_WRITERS
        value: "false"
      - key: ENABLE_PRIVATE_FILE_READS
        value: "true"
      - key: ENABLE_PRIVATE_FILE_UPLOADS
        value: "false"
      - key: ENABLE_PRIVATE_MESSAGE_UPLOADS
        value: "true"
