services:
  - type: web
    name: ping-backend-staging
    runtime: node
    repo: https://github.com/Carloschiloe/ping-app
    branch: codex/staging-beta
    region: oregon
    plan: free
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PING_ENVIRONMENT
        value: staging
      - key: PING_EXPECTED_SUPABASE_PROJECT_REF
        value: oonijgmddgyymhrlnvuu
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RUN_CRON_JOBS
        value: "false"
      - key: ENABLE_AUTOMATIONS
        value: "false"
      - key: ENABLE_NON_MVP_CAPABILITIES
        value: "false"
      - key: ENABLE_OPERATION_MODULE
        value: "false"
      - key: ENABLE_CALENDAR_INTEGRATION
        value: "false"
      - key: ENABLE_CALLS
        value: "false"
      - key: ENABLE_PRIVATE_FILE_READS
        value: "true"
      - key: ENABLE_PRIVATE_FILE_UPLOADS
        value: "false"
      - key: ENABLE_PRIVATE_AVATAR_UPLOADS
        value: "true"
      - key: ENABLE_PRIVATE_MESSAGE_UPLOADS
        value: "true"
