services:
  - type: web
    name: ping-backend-staging
    runtime: node
    region: oregon
    plan: free
    autoDeployTrigger: off
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PING_ENVIRONMENT
        value: staging
      - key: PING_EXPECTED_SUPABASE_PROJECT_REF
        value: oonijgmddgyymhrlnvuu
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: RUN_CRON_JOBS
        value: "false"
      - key: ENABLE_AUTOMATIONS
        value: "false"
      - key: ENABLE_NON_MVP_CAPABILITIES
        value: "false"
      - key: ENABLE_OPERATION_MODULE
        value: "false"
      - key: ENABLE_CALENDAR_INTEGRATION
        value: "false"
      - key: ENABLE_CALLS
        value: "false"
      - key: ENABLE_PRIVATE_FILE_READS
        value: "true"
      - key: ENABLE_PRIVATE_FILE_UPLOADS
        value: "false"
