<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vorian · Administración</title>
<link rel="icon" href="/marca/vorian.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form class="card login-card" id="login-form" autocomplete="on">
    <img src="/marca/vorian.png" alt="" class="login-mark">
    <h1>Administración de Vorian</h1>
    <p class="sub">Entra con tu cuenta de Vorian. Solo los administradores tienen acceso.</p>
    <label>Correo<input type="email" name="email" autocomplete="username" required></label>
    <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
    <p class="form-error" id="login-error" hidden></p>
    <button class="btn primary wide" type="submit" id="login-button">Entrar</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside>
    <div class="brand"><img src="/marca/vorian.png" alt=""><div><b>Vorian</b><small>Administración</small></div></div>
    <nav id="nav">
      <div class="navlabel">General</div>
      <a href="#resumen" data-s="resumen"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Resumen</a>
      <a href="#usuarios" data-s="usuarios"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"/></svg>Usuarios</a>
      <a href="#planes" data-s="planes"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>Pruebas y pagos</a>
      <div class="navlabel">Calidad</div>
      <a href="#errores" data-s="errores"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>Errores<span class="count" id="nav-errors" hidden></span></a>
      <a href="#opiniones" data-s="opiniones"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-12 7l-6 2 2-5a8 8 0 1 1 16-4z"/></svg>Opiniones y reportes<span class="count" id="nav-reports" hidden></span></a>
      <div class="navlabel">Plataforma</div>
      <a href="#asistente" data-s="asistente"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Uso del asistente</a>
      <a href="#gastos" data-s="gastos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/></svg>Gastos</a>
      <a href="#sistema" data-s="sistema"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>Sistema</a>
      <a href="#ajustes" data-s="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Ajustes</a>
    </nav>
    <div class="me"><div class="av" id="me-initials"></div><div><b id="me-name"></b><small>Administrador</small></div>
      <button class="icon-btn" id="logout" title="Salir" aria-label="Salir"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg></button></div>
  </aside>
  <main id="main"></main>
</div>

<div class="drawer" id="drawer" aria-live="polite"></div>
<div class="modal-back" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="/admin/app.js"></script>
</body>
</html>
